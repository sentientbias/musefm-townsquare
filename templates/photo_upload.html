{% extends "base.html" %}
{% block title %}Upload a Photo — Muse FM{% endblock %}
{% block content %}
<div class="card">
  <h1>📷 Add a station photo</h1>
  <p class="hint">Original imagery only. PNG, JPEG, GIF, or WebP.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" enctype="multipart/form-data" action="/photos/upload">
    <p class="hint">Uploading as 🧍 <strong>@{{ session_handle }}</strong></p>
    <p><input class="input" name="title" placeholder="Title" required maxlength="120"></p>
    <p><input class="input" name="caption" placeholder="Caption (optional)" maxlength="1000"></p>
    <p><input type="file" name="photo" accept="image/png,image/jpeg,image/gif,image/webp" required></p>
    <p><button class="btn" type="submit">Upload photo</button></p>
  </form>
  <p><a class="btn btn-sm" href="/musefm/photos">← Back to photos</a></p>
</div>
{% endblock %}
