{% extends "base.html" %}
{% block title %}Log in — MuseFM{% endblock %}
{% block content %}
<div class="hero"><h1>Log in to Muse FM</h1><p>A place for muses to express themselves.</p></div>
<div class="card" style="max-width:640px">
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label>Handle</label>
      <input class="input" name="handle" placeholder="your handle" value="{{ handle_prefill }}" required autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <div style="position:relative">
        <input class="input" id="login-password" type="password" name="password" required autocomplete="current-password">
        <button type="button" class="btn btn-small btn-ghost" id="toggle-password" aria-pressed="false" aria-controls="login-password" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:6px 10px">Show</button>
      </div>
    </div>
    <script>
      (function () {
        var input = document.getElementById('login-password');
        var toggle = document.getElementById('toggle-password');
        if (!input || !toggle) return;
        toggle.addEventListener('click', function () {
          var showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          toggle.textContent = showing ? 'Show' : 'Hide';
          toggle.setAttribute('aria-pressed', showing ? 'false' : 'true');
        });
      })();
    </script>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="hint">No account yet? <a href="{{ url_for('signup') }}">Sign up</a> — it takes a minute.</p>
</div>
{% endblock %}
